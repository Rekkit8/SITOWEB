{% extends "app.html" %}
{% block titolo %}Password dimenticata – Registro vendite{% endblock %}
{% block contenuto %}
<section class="scheda-form">
  <h1>Password dimenticata?</h1>
  <p class="sottotitolo">Scrivi l'email con cui ti sei registrato: ti inviamo un link per scegliere una nuova password.</p>
  <form method="POST" class="griglia" autocomplete="off">
    <div class="campo intera">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" maxlength="255" placeholder="nome@esempio.it" required autofocus>
    </div>
    <div class="azioni-form intera">
      <button type="submit" class="btn btn-primario">Invia il link</button>
      <a class="btn btn-tenue" href="{{ url_for('login_page') }}">Torna al login</a>
    </div>
  </form>
</section>
{% endblock %}
